<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="100%" role="img" aria-label="COVA online form demo">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t { font: 13px sans-serif; fill: #444441; }
      .ts { font: 12px sans-serif; fill: #888780; }
      .th { font: 500 14px sans-serif; fill: #2C2C2A; }
    </style>
  </defs>

  <!-- Title -->
  <text class="th" x="340" y="24" text-anchor="middle">COVA Online Form — What You'll See</text>
  <text class="ts" x="340" y="42" text-anchor="middle">http://cova.mfa.gov.cn/ — official form system</text>

  <!-- Step flow -->
  <rect x="40" y="60" width="130" height="44" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text class="th" x="105" y="82" text-anchor="middle">1. Open COVA</text>
  <text class="ts" x="105" y="100" text-anchor="middle">cova.mfa.gov.cn</text>
  <polyline points="170,82 192,82" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="200" y="60" width="130" height="44" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text class="th" x="265" y="82" text-anchor="middle">2. Select Passport</text>
  <text class="ts" x="265" y="100" text-anchor="middle">Choose passport type</text>
  <polyline points="330,82 352,82" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="360" y="60" width="130" height="44" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="0.5"/>
  <text class="th" x="425" y="82" text-anchor="middle">3. Fill Form</text>
  <text class="ts" x="425" y="100" text-anchor="middle">Passport & travel info</text>
  <polyline points="490,82 512,82" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="520" y="60" width="120" height="44" rx="8" fill="#FAEBDA" stroke="#BA7517" stroke-width="0.5"/>
  <text class="th" x="580" y="82" text-anchor="middle">4. Submit & Print</text>
  <text class="ts" x="580" y="100" text-anchor="middle">Sign by hand</text>

  <!-- Form mockup -->
  <rect x="40" y="120" width="600" height="240" rx="12" fill="white" stroke="#B4B2A9" stroke-width="0.5"/>
  <!-- Form header -->
  <rect x="40" y="120" width="600" height="30" rx="12" fill="#185FA5"/>
  <rect x="40" y="120" width="600" height="15" fill="#185FA5"/>
  <text style="font:500 13px sans-serif; fill:white;" x="340" y="140" text-anchor="middle">中华人民共和国签证申请表 | Visa Application Form</text>

  <!-- Form fields -->
  <!-- Row 1 -->
  <rect x="60" y="162" width="260" height="28" rx="4" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text class="ts" x="70" y="177" fill="#888780">Full Name (as in passport)</text>
  <text class="t" x="70" y="192">JOHN MICHAEL SMITH</text>

  <rect x="340" y="162" width="180" height="28" rx="4" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text class="ts" x="350" y="177" fill="#888780">Passport Number</text>
  <text class="t" x="350" y="192">AB1234567</text>

  <!-- Row 2 -->
  <rect x="60" y="202" width="160" height="28" rx="4" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text class="ts" x="70" y="217" fill="#888780">Date of Birth</text>
  <text class="t" x="70" y="232">1990-05-15</text>

  <rect x="240" y="202" width="160" height="28" rx="4" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text class="ts" x="250" y="217" fill="#888780">Nationality</text>
  <text class="t" x="250" y="232">UNITED STATES</text>

  <!-- Row 3 -->
  <rect x="60" y="242" width="180" height="28" rx="4" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text class="ts" x="70" y="257" fill="#888780">Intended Arrival Date</text>
  <text class="t" x="70" y="272">2026-09-01</text>

  <rect x="260" y="242" width="160" height="28" rx="4" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text class="ts" x="270" y="257" fill="#888780">Duration of Stay</text>
  <text class="t" x="270" y="272">30 days</text>

  <!-- Photo box -->
  <rect x="490" y="155" width="110" height="120" rx="4" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4,2"/>
  <text class="ts" x="545" y="210" text-anchor="middle" fill="#888780">Photo</text>
  <text class="ts" x="545" y="228" text-anchor="middle" fill="#888780">48×33mm</text>
  <text class="ts" x="545" y="246" text-anchor="middle" fill="#888780">White background</text>

  <!-- Signature line -->
  <line x1="60" y1="335" x2="260" y2="335" stroke="#B4B2A9" stroke-width="0.5"/>
  <text class="ts" x="60" y="352">Signature (hand-sign after printing — mandatory)</text>

  <!-- Tip -->
  <rect x="40" y="350" width="600" height="28" rx="6" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text class="ts" x="340" y="369" text-anchor="middle" fill="#185FA5">Tip: Print the COVA form and sign it by hand before visiting the visa center</text>
</svg>
