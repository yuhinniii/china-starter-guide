<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="100%" role="img" aria-label="Visa center process illustration">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t { font: 13px sans-serif; fill: #444441; }
      .ts { font: 12px sans-serif; fill: #888780; }
      .th { font: 500 14px sans-serif; fill: #2C2C2A; }
    </style>
  </defs>

  <!-- Title -->
  <text class="th" x="340" y="24" text-anchor="middle">Visa Center Process — What Happens In Person</text>
  <text class="ts" x="340" y="42" text-anchor="middle">Typical visit takes 30–60 minutes | https://www.visaforchina.cn/</text>

  <!-- Step 1: Security Check -->
  <rect x="40" y="60" width="140" height="90" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text class="th" x="110" y="84" text-anchor="middle">1. Security Check</text>
  <text class="ts" x="110" y="104" text-anchor="middle">Bag &amp; body screening</text>
  <text class="ts" x="110" y="122" text-anchor="middle">Like airport security</text>
  <text class="ts" x="110" y="140" text-anchor="middle">No need to remove shoes</text>

  <!-- Arrow -->
  <polyline points="180,105 200,105" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Step 2: Document Check -->
  <rect x="210" y="60" width="140" height="90" rx="10" fill="#EAF3DE" stroke="#639922" stroke-width="0.5"/>
  <text class="th" x="280" y="84" text-anchor="middle">2. Document Check</text>
  <text class="ts" x="280" y="104" text-anchor="middle">Staff reviews your docs</text>
  <text class="ts" x="280" y="122" text-anchor="middle">COVA form (printed &amp; signed)</text>
  <text class="ts" x="280" y="140" text-anchor="middle">Passport + photo + support</text>

  <!-- Arrow -->
  <polyline points="350,105 370,105" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Step 3: Biometrics -->
  <rect x="380" y="60" width="140" height="90" rx="10" fill="#FAEBDA" stroke="#BA7517" stroke-width="0.5"/>
  <text class="th" x="450" y="84" text-anchor="middle">3. Biometrics</text>
  <text class="ts" x="450" y="104" text-anchor="middle">Fingerprint scan (index)</text>
  <text class="ts" x="450" y="122" text-anchor="middle">Photo taken on-site</text>
  <text class="ts" x="450" y="140" text-anchor="middle">Takes ~5 minutes</text>

  <!-- Arrow -->
  <polyline points="520,105 540,105" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Step 4: Payment -->
  <rect x="550" y="60" width="90" height="90" rx="10" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.5"/>
  <text class="th" x="595" y="84" text-anchor="middle">4. Payment</text>
  <text class="ts" x="595" y="104" text-anchor="middle">Pay the visa fee</text>
  <text class="ts" x="595" y="122" text-anchor="middle">Cash, card, or</text>
  <text class="ts" x="595" y="140" text-anchor="middle">money order</text>

  <!-- Timeline bar -->
  <rect x="40" y="170" width="600" height="8" rx="4" fill="#E6F1FB"/>
  <text class="ts" x="340" y="194" text-anchor="middle">Total time: 30–60 minutes (depends on queue)</text>

  <!-- What to bring checklist -->
  <rect x="40" y="210" width="600" height="170" rx="12" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text class="th" x="60" y="234">✅ What to Bring (Checklist)</text>

  <text class="t" x="60" y="258">☑ Printed &amp; hand-signed COVA application form</text>
  <text class="t" x="60" y="278">☑ Valid passport (6+ months, 2+ blank pages)</text>
  <text class="t" x="60" y="298">☑ Passport photo (48×33mm, white background)</text>
  <text class="t" x="60" y="318">☑ Supporting docs (flight booking, hotel, or invitation)</text>
  <text class="t" x="60" y="338">☑ Previous Chinese visa copy (if any)</text>
  <text class="t" x="60" y="358">☑ Payment (check accepted methods at your center)</text>

  <!-- Pickup notice -->
  <rect x="40" y="390" width="600" height="32" rx="6" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text class="ts" x="340" y="411" text-anchor="middle">📌 Pickup: You'll get an SMS/email when ready. Bring your receipt to collect passport.</text>
</svg>
